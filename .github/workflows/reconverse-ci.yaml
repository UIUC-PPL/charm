name: reconverse-ci

# CI for the reviewed reconverse line. The tier below defines what CI
# GUARANTEES; it is a floor, not the support surface. Features without a
# test here are supported with coverage debt -- the tier is meant to GROW
# toward them, and dropping support for anything is an explicit reviewed
# act (a tombstone commit deleting its test), never a side effect of a
# test not yet existing. Correctness-gated only -- never timing-gated:
# hosted runners are noisy. Real-fabric behavior (IB, Slingshot) is NOT
# covered here; runtime-core PRs get a manual run on an HPC site by a
# reviewer (see PR template) until a sanctioned site runner exists.

on:
  push:
    branches: [reviewed-with-reconverse, recharm, objid-redesign]
  pull_request:
    # objid-pr*: the PRs stacked on objid-redesign (their base is the previous PR's branch)
    branches: [reviewed-with-reconverse, recharm, objid-redesign, 'objid-pr*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin the OFI provider. LCI takes the FIRST fi_getinfo() match, and which
  # provider ranks first is a property of the runner's host, not of this
  # repo: a hosted VM that exposes an RDMA-capable NIC gets a hardware
  # provider ahead of tcp, and fi_enable() then fails with ENOMEM
  # (lci/src/network/ofi/backend_ofi.cpp:273) inside ConverseInit, before
  # any test code runs. That is a runner lottery, not a regression -- it is
  # why identical commits pass one day and abort the next, and why one
  # ubuntu-latest job can pass while its sibling aborts in the same run.
  # Hosted runners never covered a real fabric anyway (see the header: IB
  # and Slingshot are the manual HPC-site run's job), so pinning tcp costs
  # no coverage and makes every runner in the pool behave identically.
  # Shrinking the queues (LCI_ATTR_NET_MAX_CQES) does NOT help: the failure
  # is provider selection, not queue size.
  FI_PROVIDER: tcp

  # Curated test tier. Grows one reviewed PR at a time; every tests/ dir NOT
  # listed here is by definition unsupported-on-reconverse until added (the
  # parity matrix mirrors this list). within_node_bcast and the zerocopy
  # dirs entered with the reconverse bump to 58921e9 (reconverse #217, #222):
  # they are the tests that caught both bugs. zerocopy/zc_post_modify_size
  # stays out until reconverse #223 (2-process data mismatch) is fixed, and
  # zerocopy/large_p2p (a 2 GiB transfer, kept out of zerocopy/Makefile's own
  # test target as well) does not fit a hosted runner. amr_1d_simple,
  # dynamic_insertion and dynamic_insertion_deletion entered 2026-10-18: a
  # deleted index re-created on another PE (amr_1d_simple at 4 PEs) caught the
  # retired-id defect of the 64-bit id redesign that the tier had missed.
  # objid_insert and objid_wide entered 2026-10-19 with the merge of the id
  # redesign (PR 1d): objid_insert reproduces that defect deterministically
  # (phase 7), objid_wide covers the wide-collection layout.
  # examples/charm++/hello/local covers [local] entry methods (#4065).
  # atsync_reduction (2026-10-25): reductions in flight across an AtSync
  # balancing step, and arrays with stable locations (-s -d) keeping their
  # no-broadcast-in-flight promise (#4072).
  TEST_DIRS: >-
    tests/charm++/megatest
    tests/charm++/simplearrayhello
    tests/charm++/anytime_migration
    tests/charm++/amr_1d_simple
    tests/charm++/dynamic_insertion
    tests/charm++/dynamic_insertion_deletion
    tests/charm++/objid_insert
    tests/charm++/objid_wide
    tests/charm++/anytime_bcastred
    tests/charm++/atsync_reduction
    tests/charm++/threaded_redn
    tests/charm++/qd
    tests/charm++/within_node_bcast
    tests/charm++/zerocopy/zerocopy_with_qd
    tests/charm++/zerocopy/direct_api
    tests/charm++/zerocopy/large_bcast
    tests/charm++/zerocopy/bcast_nonzero_root
    tests/charm++/zerocopy/dereg_and_nodereg
    tests/charm++/zerocopy/zc_post_async
    tests/charm++/zerocopy/pup_buffer
    examples/charm++/user-driven-interop
    examples/charm++/hello/local

jobs:

  reconverse-linux-x86_64:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libfabric-dev
      - name: build
        run: ./build charm++ reconverse-linux-x86_64 -j4 -g
      - name: build tests
        run: |
          set -e
          B=$PWD/reconverse-linux-x86_64
          for d in $TEST_DIRS; do make -C $d CHARMC=$B/bin/charmc; done
      - name: test (single process)
        run: |
          set -e
          for d in $TEST_DIRS; do make -C $d test; done
      - name: test (2 processes, lcrun)
        run: |
          set -e
          # lcrun's file PMI backend shares one fixed rendezvous dir per host; a run that dies mid-bootstrap poisons it and the next launch aborts or hangs (charm #3987, uiuc-hpc/lci#202).
          rm -rf "$HOME/.tmp/lct_pmi_file-"*
          for d in $TEST_DIRS; do TESTRUN_PROCS=2 timeout 900 make -C $d test; done

  # ARM64 Linux (Grace-class systems). Replaces the coverage CircleCI's
  # arm.medium jobs provided on the classic line; -Werror=vla carried over
  # from those jobs.
  reconverse-linux-arm8:
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libfabric-dev
      - name: build
        run: ./build charm++ reconverse-linux-arm8 -j4 -g -Werror=vla
      - name: build tests
        run: |
          set -e
          B=$PWD/reconverse-linux-arm8
          for d in $TEST_DIRS; do make -C $d CHARMC=$B/bin/charmc; done
      - name: test (single process)
        run: |
          set -e
          for d in $TEST_DIRS; do make -C $d test; done
      - name: test (2 processes, lcrun)
        run: |
          set -e
          # lcrun's file PMI backend shares one fixed rendezvous dir per host; a run that dies mid-bootstrap poisons it and the next launch aborts or hangs (charm #3987, uiuc-hpc/lci#202).
          rm -rf "$HOME/.tmp/lct_pmi_file-"*
          for d in $TEST_DIRS; do TESTRUN_PROCS=2 timeout 900 make -C $d test; done

  reconverse-darwin-arm64:
    timeout-minutes: 90
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      - name: install dependencies
        run: brew install libfabric coreutils  # coreutils for gtimeout (see the 2-process test step)
      - name: build
        run: ./build charm++ reconverse-darwin-arm8 -j4 -g
      - name: build tests
        run: |
          set -e
          B=$PWD/reconverse-darwin-arm8
          for d in $TEST_DIRS; do make -C $d CHARMC=$B/bin/charmc; done
      - name: test (single process)
        run: |
          set -e
          for d in $TEST_DIRS; do make -C $d test; done
      - name: test (2 processes, lcrun)
        run: |
          set -e
          # lcrun's file PMI backend shares one fixed rendezvous dir per host; a run that dies mid-bootstrap poisons it and the next launch aborts or hangs (charm #3987, uiuc-hpc/lci#202).
          rm -rf "$HOME/.tmp/lct_pmi_file-"*
          for d in $TEST_DIRS; do TESTRUN_PROCS=2 gtimeout 900 make -C $d test; done

  # Windows (NAMD's desktop users). MSVC driven from Cygwin through unix2nt_cc,
  # as Charm++'s Windows builds always were. A Windows build is one process
  # (reconverse has no communication backend there), so there is no lcrun
  # step; RUN_PROCS= turns the two-process runs that some test Makefiles add
  # (user-driven-interop) into single-process ones.
  reconverse-win-x86_64:
    timeout-minutes: 150
    runs-on: windows-latest
    defaults:
      run:
        # Cygwin's bash, with the MSVC environment set up below inherited;
        # CHERE_INVOKING keeps the login shell in the checkout.
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
    env:
      CHERE_INVOKING: 1
    steps:
      # The build scripts run under bash, so they must be checked out with
      # LF line endings; the runner's git converts to CRLF by default.
      - name: check out with LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      # cmake and make for the build, gcc-core for the cpp that preprocesses
      # .ci files.
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: cmake make gcc-core
      # cl, link and ml64 (reconverse's fcontext sources are MASM).
      - uses: ilammy/msvc-dev-cmd@v1
      # Configure on its own, under a watchdog. The first runs of this job
      # stalled silently in the configure, after its last feature test, until
      # the job's time limit; the same configure takes about three minutes on
      # a Windows desktop. So it records what it is doing: CMake's --trace
      # goes to a file, and if the configure is still running after 25
      # minutes the watchdog prints the end of that trace and the running
      # processes (ps -W) while the stall is live, then fails the step. stdin
      # is /dev/null so that no child can block waiting on the runner's.
      - name: configure
        timeout-minutes: 30
        run: |
          trace=$PWD/configure-trace.log
          ./build charm++ reconverse-win-x86_64 -g --only-configure \
            --with-cmake-args="--trace --trace-redirect=$trace" < /dev/null &
          configure=$!
          (
            for _ in $(seq 1500); do
              sleep 1
              kill -0 "$configure" 2>/dev/null || exit 0
            done
            echo "::error::configure still running after 25 minutes; its last trace lines and the running processes follow"
            tail -n 40 "$trace"
            ps -W
            kill "$configure"
          ) &
          watchdog=$!
          rc=0
          wait "$configure" || rc=$?
          wait "$watchdog" || true
          exit $rc
      - name: build
        timeout-minutes: 90
        run: make -C reconverse-win-x86_64 -j4
      - name: build tests
        timeout-minutes: 20
        run: |
          set -e
          B=$PWD/reconverse-win-x86_64
          for d in $TEST_DIRS; do make -C $d CHARMC=$B/bin/charmc; done
      - name: test (single process)
        timeout-minutes: 20
        run: |
          set -e
          for d in $TEST_DIRS; do make -C $d test RUN_PROCS=; done

  # Race/stress tier: error checking live (CkEnforce-heavy tests with teeth),
  # heavy anytime-migration stress (the #3939 regression class), QD settles,
  # both process shapes. This is the job that hunts the bug class this line's
  # hardening exists for.
  reconverse-linux-stress:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libfabric-dev
      - name: build (error checking on)
        run: ./build charm++ reconverse-linux-x86_64 -j4 -g --enable-error-checking
      - name: build stress tests
        run: |
          set -e
          B=$PWD/reconverse-linux-x86_64
          make -C tests/charm++/anytime_bcastred CHARMC=$B/bin/charmc
          make -C tests/charm++/qd CHARMC=$B/bin/charmc
          make -C tests/charm++/megatest CHARMC=$B/bin/charmc
      # Heavy migration config (-m 1 -c 8): every step migrates 8 of the 8
      # elements; -u repeats it on an unbounded array (hashed element ids,
      # whose home is rank 0 of a process chosen by the index hash). Exercises the #3939 class (obligation-free PEs vs reduction
      # tree) that this line's reduction fix closes; hangs without it.
      - name: anytime migration stress (single process)
        run: |
          set -e
          cd tests/charm++/anytime_bcastred
          for S in 1 2 3; do
            ./bcastred +pe 4 -n 8 -i 500 -m 1 -c 8 -S $S -w 30
            ./bcastred +pe 4 -n 8 -i 500 -m 1 -c 8 -S $S -w 30 -u
          done
      - name: anytime migration stress (2 processes)
        run: |
          set -e
          # lcrun's file PMI backend shares one fixed rendezvous dir per host; a run that dies mid-bootstrap poisons it and the next launch aborts or hangs (charm #3987, uiuc-hpc/lci#202).
          rm -rf "$HOME/.tmp/lct_pmi_file-"*
          cd tests/charm++/anytime_bcastred
          B=$PWD/../../../reconverse-linux-x86_64
          for S in 4 5; do
            timeout 900 $B/_deps/lci-src/lcrun -n 2 ./bcastred +pe 4 -n 8 -i 500 -m 1 -c 8 -S $S -w 30
            timeout 900 $B/_deps/lci-src/lcrun -n 2 ./bcastred +pe 4 -n 8 -i 500 -m 1 -c 8 -S $S -w 30 -u
          done
      - name: qd + megatest multi-process
        run: |
          set -e
          # lcrun's file PMI backend shares one fixed rendezvous dir per host; a run that dies mid-bootstrap poisons it and the next launch aborts or hangs (charm #3987, uiuc-hpc/lci#202).
          rm -rf "$HOME/.tmp/lct_pmi_file-"*
          B=$PWD/reconverse-linux-x86_64
          cd tests/charm++/qd
          timeout 900 $B/_deps/lci-src/lcrun -n 2 ./qdbench +pe 4
          cd ../megatest
          timeout 900 $B/_deps/lci-src/lcrun -n 2 ./megatest +pe 4

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install prerequisites
        run: pip3 install sphinx sphinx_rtd_theme
      - name: Run sphinx
        run: |
          cd doc
          make html

  shellcheck:
    # See https://github.com/koalaman/shellcheck/wiki
    # for explanations of ShellCheck error codes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          # TODO: add more scripts
          shellcheck \
            build \
            buildcmake \
            coverage/buildstamp.sh \
            coverage/report.sh \
            coverage/run.sh \
            package-tarball.sh \
            relink.script \
            src/scripts/commitid.sh \
            src/scripts/testrun

  # AMPI tier: TCharm and AMPI on reconverse, with migratable threads and
  # isomalloc. tests/ampi is driven by its own Makefile, which on reconverse
  # leaves out chkpt. A rank migrating between processes resumes on a stack
  # holding return addresses into libreconverse, so the multi-process run
  # disables ASLR (setarch -R; the launcher's children inherit it).
  # tests/campi runs AMPI ranks as C++20 coroutines from the same libampi.
  # migratable_threads packs and unpacks threads in one process. megatest is
  # run from the same build to show the AMPI build changes nothing for a
  # program that does not link TCharm.
  ampi-linux-x86_64:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # reconverse is the contrib/reconverse submodule.
          submodules: true
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libfabric-dev
      - name: build AMPI (builds Charm++ and TCharm too)
        run: ./build AMPI reconverse-linux-x86_64 -j4 -g
      - name: tests/ampi (single process)
        run: make -C tests/ampi test
      - name: tests/ampi (2 processes, lcrun)
        run: |
          set -e
          # lcrun's file PMI backend shares one fixed rendezvous dir per host; a run that dies mid-bootstrap poisons it and the next launch aborts or hangs (charm #3987, uiuc-hpc/lci#202).
          rm -rf "$HOME/.tmp/lct_pmi_file-"*
          TESTRUN_PROCS=2 timeout 1800 setarch "$(uname -m)" -R make -C tests/ampi test
      - name: tests/campi (single process)
        run: make -C tests/campi test
      - name: migratable_threads
        run: |
          set -e
          B=$PWD/reconverse-linux-x86_64
          make -C tests/charm++/migratable_threads CHARMC=$B/bin/charmc
          make -C tests/charm++/migratable_threads test
      - name: megatest from the AMPI build
        run: |
          set -e
          B=$PWD/reconverse-linux-x86_64
          make -C tests/charm++/megatest CHARMC=$B/bin/charmc
          make -C tests/charm++/megatest test
